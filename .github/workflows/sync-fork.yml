name: Sync Fork on Push

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork
        run: |
          git clone https://x-access-token:${{ secrets.FORK_SYNC_TOKEN }}@github.com/kayzama/GR27.git 2>&1
          cd GR27
          git remote add upstream https://github.com/KLTN-03-2026/GR27.git 2>&1
          git fetch upstream 2>&1
          git checkout main 2>&1
          git merge upstream/main --no-edit 2>&1
          git push origin main 2>&1
        env:
          GIT_TRACE: 1